<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="45%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#A5F3FC" />
      <stop offset="70%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0" />
      <stop offset="25%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="1" />
      <stop offset="75%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0.01" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#gridGrad)" stroke-width="0.75" />
      <circle cx="40" cy="40" r="1" fill="#00DFD8" fill-opacity="0.25" />
    </pattern>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-8px); opacity: 0.9; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .orb-anim { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
    .blink-anim { animation: blinkDot 2s ease-in-out infinite; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Background Lights -->
  <circle cx="150" cy="100" r="220" fill="url(#orbPurple)" class="orb-anim" />
  <circle cx="1050" cy="180" r="260" fill="url(#orbCyan)" class="orb-anim" />

  <!-- High-Tech Cyber Grid Background -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Card Border with Neon Stroke -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner HUD Accents -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00DFD8" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glowCyan)" />
  <path d="M 1180 40 L 1180 20 L 1160 20" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glowPurple)" />
  <path d="M 20 340 L 20 360 L 40 360" stroke="#7928CA" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glowPurple)" />
  <path d="M 1180 340 L 1180 360 L 1160 360" stroke="#00DFD8" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glowCyan)" />

  <!-- ================= TOP TERMINAL CONTROL BAR ================= -->
  <g transform="translate(30, 20)">
    <!-- Window Dots -->
    <circle cx="15" cy="15" r="5.5" fill="#EF4444" />
    <circle cx="33" cy="15" r="5.5" fill="#F59E0B" />
    <circle cx="51" cy="15" r="5.5" fill="#10B981" />

    <!-- Terminal Prompt Title -->
    <text x="80" y="20" fill="#64748B" font-size="12" class="font-mono" font-weight="600" letter-spacing="1">
      thevindu@datascience-node:<tspan fill="#00DFD8">~</tspan><tspan fill="#7928CA">/portfolio</tspan> (main)
    </text>

    <!-- Status Indicator Pill -->
    <g transform="translate(1000, 4)">
      <rect width="110" height="22" rx="11" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#10B981" class="blink-anim" filter="url(#glowCyan)" />
      <text x="26" y="15" fill="#10B981" font-size="10" class="font-mono" font-weight="700" letter-spacing="1">SYSTEM: LIVE</text>
    </g>
  </g>

  <!-- Horizontal Top Separator Line -->
  <line x1="30" y1="52" x2="1170" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- Floating Particles / Data Nodes -->
  <g class="particle-1">
    <circle cx="180" cy="140" r="2" fill="#00DFD8" />
    <circle cx="220" cy="120" r="1.5" fill="#7928CA" />
    <line x1="180" y1="140" x2="220" y2="120" stroke="#00DFD8" stroke-opacity="0.3" stroke-width="0.75" />
    <circle cx="980" cy="240" r="2.5" fill="#A855F7" />
    <circle cx="1020" cy="220" r="1.5" fill="#00DFD8" />
    <line x1="980" y1="240" x2="1020" y2="220" stroke="#A855F7" stroke-opacity="0.3" stroke-width="0.75" />
  </g>
  <g class="particle-2">
    <circle cx="260" cy="220" r="2" fill="#38BDF8" />
    <circle cx="920" cy="130" r="2" fill="#00DFD8" />
  </g>

  <!-- ================= MAIN CONTENT ================= -->
  <!-- Tagline Mini Badge -->
  <g transform="translate(600, 95)">
    <rect x="-160" y="-12" width="320" height="24" rx="12" fill="#0F172A" stroke="#00DFD8" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#00DFD8" font-size="11" class="font-mono" font-weight="700" letter-spacing="2">
      ⚡ DATA SCIENCE &amp; SOFTWARE ENGINEERING
    </text>
  </g>

  <!-- Big Hero Title: THEVINDU DHARMADASA -->
  <text x="600" y="165" text-anchor="middle" fill="url(#textGrad)" font-size="50" class="font-sans" font-weight="900" letter-spacing="3.5" filter="url(#glowCyan)">
    THEVINDU DHARMADASA
  </text>

  <!-- Subtitle: Specializations -->
  <text x="600" y="212" text-anchor="middle" fill="#94A3B8" font-size="16" class="font-mono" font-weight="600" letter-spacing="2.5">
    DATA SCIENCE UNDERGRADUATE <tspan fill="#00DFD8">•</tspan> MACHINE LEARNING DEVELOPER <tspan fill="#7928CA">•</tspan> FULL-STACK ENGINEER
  </text>

  <!-- Glowing Accent Divider Line -->
  <line x1="250" y1="245" x2="950" y2="245" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glowCyan)" />

  <!-- ================= DOMAIN PILLS ROW ================= -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Machine Learning -->
    <g transform="translate(-460, 0)">
      <rect width="210" height="34" rx="17" fill="url(#pillGrad)" stroke="#7928CA" stroke-opacity="0.4" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#E2E8F0" font-size="12" class="font-sans" font-weight="600">
        🤖 Machine Learning &amp; AI
      </text>
    </g>

    <!-- Pill 2: Data Science -->
    <g transform="translate(-230, 0)">
      <rect width="210" height="34" rx="17" fill="url(#pillGrad)" stroke="#00DFD8" stroke-opacity="0.4" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#E2E8F0" font-size="12" class="font-sans" font-weight="600">
        📊 Data Science &amp; Analytics
      </text>
    </g>

    <!-- Pill 3: Full Stack -->
    <g transform="translate(20, 0)">
      <rect width="210" height="34" rx="17" fill="url(#pillGrad)" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#E2E8F0" font-size="12" class="font-sans" font-weight="600">
        💻 Full-Stack Architecture
      </text>
    </g>

    <!-- Pill 4: Data Engineering -->
    <g transform="translate(250, 0)">
      <rect width="210" height="34" rx="17" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#E2E8F0" font-size="12" class="font-sans" font-weight="600">
        ⚡ Data &amp; Cloud Pipelines
      </text>
    </g>
  </g>

  <!-- Bottom Location & Academic Tag -->
  <g transform="translate(600, 352)">
    <text x="0" y="0" text-anchor="middle" fill="#64748B" font-size="11" class="font-mono" letter-spacing="1.5">
      📍 SRI LANKA 🇱🇰 &#160;|&#160; 🎓 BSc (HONS) DATA SCIENCE &#160;|&#160; ☕ FUELED BY CODE &amp; CONTINUOUS CURIOSITY
    </text>
  </g>
</svg>
